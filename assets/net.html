    if(nd.lf!==undefined){var lq=((t-nd.lf)%LOOP+LOOP)%LOOP;if(lq<2.5)fl=Math.max(fl,2*Math.exp(-lq*3));}
    var wg2=wave1(nd.rad,t);
    var alpha=(0.07+0.93*ak)*pd[i]*(ak>0?(breath*ak+(1-ak)):1)*(1+1.2*wg2*ak)*(1+0.8*hb*ak)+fl*0.5;
    var size=14*pk[i]*(0.6+0.4*ak)*(1+0.5*wg2*ak+0.4*fl);
    alpha=clamp(alpha,0,1);
    if(pz[i]<800){
      var bf=(800-pz[i])/800;
      size*=1+bf*3;alpha*=1-bf*0.45;
      x.globalAlpha=alpha*0.9;x.drawImage(SP_BOKEH,px[i]-size,py[i]-size,size*2,size*2);
    }else{
      x.globalAlpha=alpha;x.drawImage(SP_NODE,px[i]-size,py[i]-size,size*2,size*2);
    }
  }
  /* pulses */
  var brMax=0;
  for(var pi=0;pi<pulses.length;pi++){
    var pu=pulses[pi],dist=(t-pu.ts)*900;
    var dta=t-pu.arr;
    if(dta>=0&&dta<1.15){var bv=dta<0.25?eOutCubic(dta/0.25):1-eInOutSine((dta-0.25)/0.9);if(bv>brMax)brMax=bv;}
    if(dist<0||dist>pu.len+125)continue;
    for(var s=0;s<=5;s++){
      var ds=dist-s*25;if(ds<0||ds>pu.len)continue;
      pathAt(pu,ds);project(TP[0],TP[1],TP[2]);if(PR.z<60)continue;
      var sz=(s===0?24:14-s*1.6)*PR.k*1.3;
      x.globalAlpha=(s===0?1:0.55*(1-s/6))*depthB(PR.z);
      x.drawImage(SP_PULSE,PR.x-sz,PR.y-sz,sz*2,sz*2);
    }
  }
  x.globalAlpha=1;

  /* core */
  var c=xco;
  c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation="source-over";c.clearRect(0,0,cco.width,cco.height);
  c.setTransform(SC,0,0,SC,0,0);
  c.globalCompositeOperation="lighter";
  var hs=(1+0.18*brMax+0.6*w3+0.12*hb+0.12*w1c)*(1550/D),hsz=520*hs;
  c.globalAlpha=0.9;c.drawImage(SP_HALO,CX-hsz/2,CY-hsz/2,hsz,hsz);
  var flash=0.35*w3+0.2*w1c+0.15*hb;
  if(flash>0.001){var fsz=300*(0.6+flash);c.globalAlpha=clamp(flash*1.6,0,1);c.drawImage(SP_PULSE,CX-fsz/2,CY-fsz/2,fsz,fsz);}
  c.globalAlpha=1;c.globalCompositeOperation="source-over";
  c.save();c.translate(CX-56,CY-56);c.scale(112/96,112/96);c.fillStyle="#FFFFFF";c.fill(SIG,"evenodd");c.restore();

  /* headlines */
  var o1,o2;
  if(t<55)o1=1;else if(t<56.2)o1=1-eInOutSine((t-55)/1.2);else if(t<69.3)o1=0;else if(t<70.5)o1=eInOutSine((t-69.3)/1.2);else o1=1;
  if(t<55.8)o2=0;else if(t<57)o2=eInOutSine((t-55.8)/1.2);else if(t<68.5)o2=1;else if(t<69.7)o2=1-eInOutSine((t-68.5)/1.2);else o2=0;
  h1.style.opacity=o1.toFixed(3);h1.style.transform="translateY("+((1-o1)*12).toFixed(2)+"px)";
  h2.style.opacity=o2.toFixed(3);h2.style.transform="translateY("+((1-o2)*12).toFixed(2)+"px)";

  /* service cards */
  for(var l=0;l<labelData.length;l++){
    var L=labelData[l],lt=((t-L.T)%LOOP+LOOP)%LOOP;
    if(lt>LIFE){
      if(L.on){L.el.style.opacity="0";L.el.style.filter="none";L.el.style.display="none";L.ln.setAttribute("opacity","0");L.on=false;}
      continue;
    }
    if(!L.on){L.el.style.display="block";L.on=true;}
    if(!L.w){L.w=L.el.offsetWidth||320;L.h=L.el.offsetHeight||132;}
    var ev=Math.min(eOutCubic(lt/0.6),eOutCubic((LIFE-lt)/0.6));
    var cxp=L.left?140:1780-L.w;
    var cyp=L.sy+6*Math.sin(TAU*t/6+L.idx*1.3);
    var sc=0.96+0.04*ev,ty=(1-ev)*10;
    L.el.style.opacity=ev.toFixed(3);
    L.el.style.transform="translate("+cxp.toFixed(1)+"px,"+(cyp+ty).toFixed(1)+"px) scale("+sc.toFixed(4)+")";
    L.el.style.filter=ev<0.999?"blur("+((1-ev)*6).toFixed(2)+"px)":"none";
    var k2=L.node,ax=L.left?cxp+L.w:cxp,ay=cyp+ty+L.h/2;
    var vis=pz[k2]>300?1:0;
    L.ln.setAttribute("x1",ax.toFixed(1));L.ln.setAttribute("y1",ay.toFixed(1));
    L.ln.setAttribute("x2",px[k2].toFixed(1));L.ln.setAttribute("y2",py[k2].toFixed(1));
    L.ln.setAttribute("opacity",(ev*vis).toFixed(3));
  }
};

window.addEventListener("resize",resize);
resize();

window.READY=(function(){
  var fl=[];
  try{
    fl.push(document.fonts.load("400 64px Aeonik"));
    fl.push(document.fonts.load("500 64px Aeonik"));
    fl.push(document.fonts.load("500 15px 'Plex Mono'"));
  }catch(err){}
  var imgs=Array.prototype.slice.call(document.querySelectorAll(".card img")).map(function(im){
    return im.complete?Promise.resolve():new Promise(function(r){im.onload=im.onerror=function(){r();};});
  });
  return Promise.all(fl.concat(imgs).map(function(p){return p.catch(function(){});}))
    .then(function(){return document.fonts.ready;})
    .catch(function(){})
    .then(function(){
      ready=true;
      for(var z=0;z<labelData.length;z++){labelData[z].w=0;}
      window.setTime(0);
      if(location.search.indexOf("render")===-1){
        var start=performance.now()/1000;
        var loop=function(){window.setTime((performance.now()/1000-start)%LOOP);requestAnimationFrame(loop);};
        requestAnimationFrame(loop);
      }
    });
})();
})();
</script>
